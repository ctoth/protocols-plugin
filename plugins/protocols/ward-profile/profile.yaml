name: protocols-gates
version: 0.3.4
description: >
  Phase-gate rules for the protocols plugin. Mechanically enforces the tool
  restrictions of the foreman, adversary, researcher, and experiment protocols
  at the ward PreToolUse hook. Every session phase belongs to one actor-scoped
  Ward state record, so a main manager and parallel workers cannot overwrite
  one another. Installed as a Ward profile so the gates load from
  ~/.ward/profiles for every session, independent of WARD_RULES_PATH /
  CLAUDE_ENV_FILE propagation.
exports:
  capabilities:
    - protocol-phase-gates
    - actor-scoped-protocol-phases
    - fail-closed-worker-initialization
    - native-codex-read-only-discovery
blocks:
  operations:
    - foreman-execute
    - adversary-mutate
    - researcher-edit
    - experiment-integration-move
    - experiment-evaluator-edit
    - uninitialized-worker-execute
    - native-codex-discovery-mutate
